services:
  myadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: admingru
    env_file:
      - .env
    networks:
      - camagru
    depends_on:
      - database
    expose:
      - 80
  database:
    image: mysql:26.10.0
    container_name: databasegru
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - camagru
    expose:
      - 3306
    ports:
      - "3306:3306"
  frontend:
    build: frontend
    image: frontgru
    container_name: frontgru
    env_file: .env
    networks:
      - camagru
    expose:
      - 80
  backend:
    build: backend
    image: backgru
    container_name: backgru
    env_file: .env
    networks:
      - camagru
    depends_on:
      - database
    expose:
      - 9000
  nginx:
    build: nginx
    image: nginxgru
    container_name: nginxgru
    env_file: .env
    networks:
      - camagru
    ports:
      - "8443:8443"
  swagger:
    image: docker.swagger.io/swaggerapi/swagger-ui
    container_name: swaggru
    environment:
      - SWAGGER_JSON=/spec-openapi.json
    volumes:
      - ./backend/spec-openapi.json:/spec-openapi.json
    networks:
      - camagru
    expose:
      - 8080

networks:
  camagru:
    name: camagru
    driver: bridge

volumes:
  db_data:

