services:
  database:
    image: mysql:26.10.0
    container_name: databasegru
    env_file:
      - .env
    volumes:
      - ./backend/database/:/var/lib/mysql
    networks:
      - camagru
  frontend:
    build: frontend
    image: frontgru
    container_name: frontgru
    env_file: .env
    networks:
      - camagru
  backend:
    build: backend
    image: backgru
    container_name: backgru
    env_file: .env
    networks:
      - camagru
    depends_on:
      - database
  nginx:
    build: nginx
    image: nginxgru
    container_name: nginxgru
    env_file: .env
    networks:
      - camagru
    ports:
      - "8443:8443"
  swagger:
    image: docker.swagger.io/swaggerapi/swagger-ui
    container_name: swaggru
    environment:
      - SWAGGER_JSON=/spec-openapi.json
    volumes:
      - ./backend/spec-openapi.json:/spec-openapi.json
    networks:
      - camagru

networks:
  camagru:
    name: camagru
    driver: bridge
